[project]
name = "ai-infra-copilot-api"
version = "0.1.0"
description = "FastAPI backend (modular monolith) for AI Infrastructure Copilot Phase 1"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyjwt>=2.8,<3",
    "argon2-cffi>=23.1,<24",
    "pyotp>=2.9,<3",
    "python-socketio>=5.11,<6",
    "httpx>=0.27,<1",
    "cryptography>=42,<44",
    "pypsrp>=0.8,<1",
    "python-multipart>=0.0.9,<1",
    "pgvector>=0.2.5",
    "python-docx>=1.0.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.20.0",
    "tiktoken>=0.6.0",
    # py-shared is installed separately as an editable local path dependency,


    # see scripts/dev-setup.sh — pip has no native workspace-dependency syntax.
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
