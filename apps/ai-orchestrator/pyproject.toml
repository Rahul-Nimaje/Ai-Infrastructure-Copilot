[project]
name = "ai-infra-copilot-ai-orchestrator"
version = "0.1.0"
description = "LangGraph-shaped agent orchestration service for AI Infrastructure Copilot Phase 1"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.30,<2",
    "google-genai>=2.0,<3",
    "httpx>=0.27,<1",
    # py-shared is installed separately as an editable local path dependency,
    # see scripts/dev-setup.sh — pip has no native workspace-dependency syntax.
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
